<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini → Pixso</title>
<style>
:root{
  --bg:#f6f6f4;--panel:#fff;--ink:#1b1b1a;--muted:#77756f;--line:#e3e1db;
  --accent:#3b5bfd;--accent-ink:#fff;--ok:#1f9d55;--err:#d23c3c;--tool:#f1f0ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9a978f;--line:#2f2e2b;
  --accent:#7d93ff;--accent-ink:#0d0d0c;--tool:#252522;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex}
aside{width:320px;flex:none;border-right:1px solid var(--line);padding:20px;overflow:auto;background:var(--panel)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
h1{font-size:17px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:6px}
.row>*{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.45;cursor:default}
.status{margin-top:12px;font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
.tools{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;max-height:140px;overflow:auto}
details.cfg summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:18px}
#log{flex:1;overflow:auto;padding:24px clamp(16px,4vw,48px)}
.msg{max-width:820px;margin:0 auto 14px}
.msg.user .bubble{background:var(--accent);color:var(--accent-ink);margin-left:auto;width:fit-content;max-width:85%}
.bubble{padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.user .bubble{border:0}
.msg.err .bubble{border-color:var(--err);color:var(--err)}
details.tool{background:var(--tool);border-radius:8px;padding:6px 10px;font-size:13px}
details.tool summary{cursor:pointer;font-family:var(--mono)}
details.tool pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;margin:6px 0 0}
.shot{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.empty{color:var(--muted);text-align:center;margin-top:12vh}
form#ask{border-top:1px solid var(--line);padding:14px clamp(16px,4vw,48px);background:var(--panel)}
form#ask .inner{max-width:820px;margin:0 auto}
form#ask textarea{resize:vertical;min-height:64px}
.askbar{display:flex;gap:8px;margin-top:8px;align-items:center}
.askbar input{flex:1}
.hint{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;margin-top:18px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none;transition:background .15s}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .knob{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled + .track{opacity:.4}
.switch:has(input:disabled){cursor:default}
@media (max-width:760px){body{flex-direction:column;height:auto}aside{width:auto;border-right:0;border-bottom:1px solid var(--line)}#log{min-height:50vh}}
</style>
</head>
<body>
<aside>
  <h1>Gemini → Pixso</h1>
  <p class="sub">Пишешь задачу — Gemini верстает в Pixso через MCP.</p>

  <label>Gemini API key</label>
  <input id="gKey" type="password" placeholder="AIza…">
  <label>Модель</label>
  <div class="row">
    <input id="gModel" list="models" value="gemini-3.8-flash">
    <button class="ghost" id="loadModels" style="flex:none">Список</button>
  </div>
  <datalist id="models"><option value="gemini-3.8-flash"><option value="gemini-3.1-pro-preview"></datalist>

  <label>Pixso token</label>
  <input id="pToken" type="password" placeholder="Личный токен из User Center">

  <label class="switch">
    <input type="checkbox" id="useProxy">
    <span class="track"><span class="knob"></span></span>
    <span class="switch-label">Через прокси</span>
  </label>
  <p class="hint" id="proxyHint" style="margin:4px 0 0"></p>

  <details class="cfg">
    <summary>Дополнительно</summary>
    <label>MCP URL</label>
    <input id="pUrl" value="https://pixso.net/mcp">
    <label>Заголовок для токена</label>
    <select id="pHeader">
      <option value="Token">Token: &lt;токен&gt;</option>
      <option value="Authorization">Authorization: Bearer &lt;токен&gt;</option>
    </select>
    <label>Макс. шагов за запрос</label>
    <input id="maxSteps" type="number" value="30" min="1" max="100">
  </details>

  <div style="margin-top:18px" class="row">
    <button id="connect">Подключить</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Не подключено</span></div>
  <div class="tools" id="toolsList"></div>
  <p class="hint" style="margin-top:16px">Ключи хранятся только в этом браузере (localStorage).</p>
</aside>

<main>
  <div id="log"><div class="empty" id="empty">Подключись слева, вставь ссылку на фрейм или файл и напиши, что сверстать.</div></div>
  <form id="ask">
    <div class="inner">
      <textarea id="prompt" placeholder="Например: сверстай экран логина для мобилки 390×844 — логотип, два поля, кнопка, ссылка «Забыли пароль». Всё на auto-layout."></textarea>
      <div class="askbar">
        <input id="link" placeholder="Ссылка на слой/файл Pixso (необязательно)">
        <button type="button" class="ghost" id="reset">Новый чат</button>
        <button type="button" class="ghost" id="stop" disabled>Стоп</button>
        <button id="send" disabled>Отправить</button>
      </div>
      <div class="hint" style="margin-top:6px">Ctrl/⌘ + Enter — отправить</div>
    </div>
  </form>
</main>

<script>
const $ = id => document.getElementById(id);
const IS_LOCAL = location.protocol.startsWith('http'); // страница открыта с сайта, где есть /api/mcp
const FIELDS = ['gKey','gModel','pToken','pUrl','pHeader','maxSteps','link'];
FIELDS.forEach(f => { try{ const v = localStorage.getItem('pg_'+f); if(v!==null) $(f).value = v; }catch(e){} });
if($('gModel').value === 'gemini-2.5-pro') $('gModel').value = 'gemini-3.8-flash';
if(/localhost|127\.0\.0\.1/.test($('pUrl').value)) $('pUrl').value = 'https://pixso.net/mcp';
FIELDS.forEach(f => $(f).addEventListener('change', () => { try{ localStorage.setItem('pg_'+f, $(f).value); }catch(e){} }));

// Тумблер прокси: работает, только когда страница открыта через pixso-gemini.js
if(IS_LOCAL){
  let saved = null; try{ saved = localStorage.getItem('pg_useProxy'); }catch(e){}
  $('useProxy').checked = saved === null ? true : saved === '1';
  $('proxyHint').textContent = 'Запросы к Pixso идут через прокси сайта.';
}else{
  $('useProxy').checked = false; $('useProxy').disabled = true;
  $('proxyHint').textContent = 'Недоступно: страница открыта как файл, а не с сайта.';
}
$('useProxy').addEventListener('change', () => {
  try{ localStorage.setItem('pg_useProxy', $('useProxy').checked ? '1' : '0'); }catch(e){}
  $('proxyHint').textContent = $('useProxy').checked ? 'Запросы к Pixso идут через прокси сайта.' : 'Запросы к Pixso идут напрямую из браузера.';
});

const SYSTEM = `Ты — продуктовый дизайнер, который работает прямо в Pixso через инструменты MCP. Пользователь пишет по-русски, отвечай по-русски, кратко.

Как работать:
1. Перед первой правкой вызови fetch_context (и при необходимости get_top_level_frames, read_components, read_styles, read_variables), чтобы понять файл, выделение и существующие компоненты/стили. Если пользователь дал ссылку — используй её (item-id указывает на слой).
2. Для сложных интерфейсов можно вызвать load_guidelines.
3. Строй структурно: фреймы с auto-layout (а не абсолютное позиционирование), осмысленные имена слоёв, переиспользуй существующие компоненты, стили и переменные файла, если они есть.
4. Для создания и правок используй apply_design, а для сложных операций — eval_script (глобальный объект pixso, API совместим с Figma Plugin API; перед изменением текста вызывай await pixso.loadFontAsync(...); скрипт должен вернуть JSON-сериализуемый результат).
5. Не удаляй и не меняй чужие слои без явной просьбы. Новые экраны размещай рядом с существующими, не поверх.
6. После построения проверь результат: take_screenshot и/или check_layout, исправь заметные проблемы.
7. В конце коротко опиши, что сделал.`;

let rpcId = 0, sessionId = null, protocolVersion = null, mcpTools = [], history = [], abortCtl = null, stopFlag = false;

/* ---------- MCP over Streamable HTTP ---------- */
function mcpHeaders(){
  const h = {'Content-Type':'application/json','Accept':'application/json, text/event-stream'};
  const tok = $('pToken').value.trim();
  if($('pHeader').value === 'Authorization') h['Authorization'] = 'Bearer ' + tok; else h['Token'] = tok;
  if(sessionId) h['Mcp-Session-Id'] = sessionId;
  if(protocolVersion) h['MCP-Protocol-Version'] = protocolVersion;
  return h;
}
async function readSSE(res, wantId){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.search(/\r?\n\r?\n/)) >= 0){
      const block = buf.slice(0, i); buf = buf.slice(i).replace(/^\r?\n\r?\n/, '');
      const data = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
      if(!data) continue;
      try{ const msg = JSON.parse(data); if(msg.id === wantId){ reader.cancel().catch(()=>{}); return msg; } }catch(e){}
    }
  }
  throw new Error('Поток SSE закрылся без ответа');
}
async function mcp(method, params = {}, notify = false){
  const body = {jsonrpc:'2.0', method, params};
  if(!notify) body.id = ++rpcId;
  let res;
  const viaProxy = $('useProxy').checked;
  const headers = mcpHeaders();
  if(viaProxy) headers['X-Pixso-Target'] = $('pUrl').value.trim();
  try{
    res = await fetch(viaProxy ? '/api/mcp' : $('pUrl').value.trim(), {method:'POST', headers, body:JSON.stringify(body), signal:abortCtl?.signal});
  }catch(e){
    if(e.name === 'AbortError') throw e;
    if(viaProxy) throw new Error('Прокси сайта не отвечает. Обнови страницу и попробуй ещё раз.');
    throw new Error(IS_LOCAL
      ? 'Pixso не пускает запросы напрямую из браузера (CORS). Включи тумблер «Через прокси».'
      : 'Pixso не пускает запросы напрямую из браузера (CORS). Открой страницу с сайта на Vercel — там прокси встроен.');
  }
  const sid = res.headers.get('Mcp-Session-Id'); if(sid) sessionId = sid;
  if(notify) return null;
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Pixso MCP ${res.status}: ${t.slice(0,300) || res.statusText}`);
  }
  const ct = res.headers.get('Content-Type') || '';
  const msg = ct.includes('text/event-stream') ? await readSSE(res, body.id) : await res.json();
  if(msg.error) throw new Error(`MCP: ${msg.error.message || JSON.stringify(msg.error)}`);
  return msg.result;
}

$('connect').onclick = async () => {
  setStatus('', 'Подключаюсь…'); $('connect').disabled = true; sessionId = null; protocolVersion = null;
  try{
    const init = await mcp('initialize', {protocolVersion:'2025-06-18', capabilities:{}, clientInfo:{name:'gemini-pixso-page', version:'1.0'}});
    protocolVersion = init.protocolVersion || '2025-06-18';
    await mcp('notifications/initialized', {}, true);
    mcpTools = [];
    let cursor;
    do{ const r = await mcp('tools/list', cursor ? {cursor} : {}); mcpTools.push(...(r.tools||[])); cursor = r.nextCursor; }while(cursor);
    setStatus('ok', `Pixso подключён · ${mcpTools.length} инструментов`);
    $('toolsList').textContent = mcpTools.map(t => t.name).join(' · ');
    $('send').disabled = false;
  }catch(e){ setStatus('err', e.message); }
  $('connect').disabled = false;
};
function setStatus(kind, text){ $('dot').className = 'dot ' + kind; $('statusText').textContent = text; }

/* ---------- Gemini ---------- */
const GAPI = 'https://generativelanguage.googleapis.com/v1beta';
$('loadModels').onclick = async () => {
  try{
    const r = await fetch(`${GAPI}/models?pageSize=200`, {headers:{'x-goog-api-key':$('gKey').value.trim()}});
    const j = await r.json(); if(j.error) throw new Error(j.error.message);
    const names = (j.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace('models/',''));
    $('models').innerHTML = names.map(n => `<option value="${n}">`).join('');
    addMsg('assistant', 'Доступные модели:\n' + names.join('\n'));
  }catch(e){ addMsg('err', 'Gemini: ' + e.message); }
};
function geminiTools(){
  return [{functionDeclarations: mcpTools.map(t => ({
    name: t.name,
    description: (t.description || '').slice(0, 4000),
    parametersJsonSchema: t.inputSchema && Object.keys(t.inputSchema).length ? t.inputSchema : {type:'object', properties:{}}
  }))}];
}
async function gemini(){
  const r = await fetch(`${GAPI}/models/${encodeURIComponent($('gModel').value.trim())}:generateContent`, {
    method:'POST', signal:abortCtl.signal,
    headers:{'Content-Type':'application/json','x-goog-api-key':$('gKey').value.trim()},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]}, contents:history, tools:geminiTools()})
  });
  const j = await r.json().catch(()=>({error:{message:'Пустой ответ (проверь доступ к Gemini/DNS)'}}));
  if(j.error) throw new Error('Gemini: ' + j.error.message);
  const c = j.candidates?.[0];
  if(!c?.content) throw new Error('Gemini не вернул ответ' + (c?.finishReason ? ` (${c.finishReason})` : ''));
  return c.content;
}

/* ---------- Agent loop ---------- */
async function run(text){
  const link = $('link').value.trim();
  history.push({role:'user', parts:[{text: link ? `${text}\n\nСсылка Pixso: ${link}` : text}]});
  stopFlag = false; abortCtl = new AbortController();
  $('send').disabled = true; $('stop').disabled = false;
  const max = +$('maxSteps').value || 30;
  try{
    for(let step = 0; step < max; step++){
      if(stopFlag) break;
      const content = await gemini();
      history.push(content);
      const parts = content.parts || [];
      const said = parts.filter(p => p.text && !p.thought).map(p => p.text).join('').trim();
      if(said) addMsg('assistant', said);
      const calls = parts.filter(p => p.functionCall).map(p => p.functionCall);
      if(!calls.length) return;
      const out = [];
      for(const fc of calls){
        if(stopFlag) break;
        const el = addTool(fc.name, fc.args);
        let resText, ok = true;
        const images = [];
        try{
          const r = await mcp('tools/call', {name:fc.name, arguments:fc.args || {}});
          const texts = [];
          for(const c of r.content || []){
            if(c.type === 'text') texts.push(c.text);
            else if(c.type === 'image'){ images.push({inlineData:{mimeType:c.mimeType, data:c.data}}); showShot(el, c); texts.push('[скриншот приложен]'); }
            else texts.push(JSON.stringify(c));
          }
          if(r.structuredContent && !texts.length) texts.push(JSON.stringify(r.structuredContent));
          resText = texts.join('\n') || '(пусто)';
          ok = !r.isError;
          finishTool(el, resText, ok);
        }catch(e){
          if(e.name === 'AbortError') throw e;
          resText = e.message; ok = false; finishTool(el, resText, false);
        }
        const resp = {name:fc.name, response: ok ? {output: resText.slice(0, 40000)} : {error: resText.slice(0, 40000)}};
        if(fc.id) resp.id = fc.id;
        if(images.length) resp.parts = images;
        out.push({functionResponse: resp});
      }
      history.push({role:'user', parts:out});
    }
    if(!stopFlag) addMsg('assistant', `Остановился на лимите шагов (${max}). Напиши «продолжай», если нужно.`);
  }catch(e){
    if(e.name !== 'AbortError') addMsg('err', e.message);
  }finally{
    if(stopFlag) addMsg('assistant', 'Остановлено.');
    $('send').disabled = false; $('stop').disabled = true; abortCtl = null;
  }
}

/* ---------- UI ---------- */
function addMsg(kind, text){
  $('empty')?.remove();
  const d = document.createElement('div'); d.className = 'msg ' + kind;
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  d.appendChild(b); $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function addTool(name, args){
  $('empty')?.remove();
  const d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = `<details class="tool"><summary>⏳ ${name}</summary><pre class="a"></pre><pre class="r"></pre></details>`;
  d.querySelector('.a').textContent = '→ ' + JSON.stringify(args || {}, null, 2);
  $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function finishTool(el, text, ok){
  el.querySelector('summary').textContent = (ok ? '✓ ' : '✕ ') + el.querySelector('summary').textContent.slice(2);
  el.querySelector('.r').textContent = '← ' + text.slice(0, 6000);
}
function showShot(el, c){
  const img = document.createElement('img'); img.className = 'shot'; img.src = `data:${c.mimeType};base64,${c.data}`;
  el.appendChild(img); $('log').scrollTop = 1e9;
}

$('ask').onsubmit = e => {
  e.preventDefault();
  const t = $('prompt').value.trim(); if(!t || $('send').disabled) return;
  if(!$('gKey').value.trim()) return addMsg('err', 'Вставь Gemini API key.');
  addMsg('user', t); $('prompt').value = ''; run(t);
};
$('prompt').addEventListener('keydown', e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('ask').requestSubmit(); });
$('stop').onclick = () => { stopFlag = true; abortCtl?.abort(); };
$('reset').onclick = () => { history = []; $('log').innerHTML = '<div class="empty" id="empty">Новый чат.</div>'; };
</script>
</body>
</html>
